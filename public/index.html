<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0a0f0a" />
  <title>Gallowmere</title>
  <meta name="description" content="A dark fantasy text MUD where the townsfolk remember you." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="build/app.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="power-on">
    <header id="status">
      <span class="brand">GALLOWMERE</span>
      <span id="status-info"></span>
      <span id="conn" class="conn conn-wait" title="Connecting">connecting</span>
    </header>
    <main id="term"></main>
    <nav id="exits" aria-label="Exits"></nav>
    <form id="input-row" autocomplete="off">
      <label id="prompt" for="cmd">Name: </label>
      <input id="cmd" type="text" maxlength="300" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" />
      <button id="send" type="submit" aria-label="Send">&#9166;</button>
    </form>
  </div>
  <div class="crt scanlines"></div>
  <div class="crt vignette"></div>
  <script src="build/app.js"></script>
</body>
</html>
