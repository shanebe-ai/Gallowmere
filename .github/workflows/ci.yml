name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gallowmere
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: gallowmere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gallowmere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      TEST_DB_NAME: gallowmere_test
      TEST_DB_USER: gallowmere
      TEST_DB_PASSWORD: ci-test-password

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
